[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Application monopage : toute route inconnue est servie par index.html.
# Les fichiers reellement presents dans dist/ (assets, images) sont servis
# en priorite par Netlify et ne passent pas par cette regle.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# En-tetes de securite. Une societe de securite dont le site n'en a pas
# se decredibilise au premier prospect qui regarde.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# L'interface d'administration charge Decap CMS et Netlify Identity depuis un
# CDN : la politique stricte du site la bloquerait. On desserre uniquement sur
# /admin/*, jamais sur les pages publiques.
#
# Compromis assume : dependance a unpkg pour l'admin. Pour supprimer ce risque
# de chaine d'approvisionnement, installer decap-cms en dependance npm et
# servir le bundle depuis /admin/ — voir DEPLOIEMENT.md.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://identity.netlify.com; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self' data: https://unpkg.com; img-src 'self' data: blob: https://*.githubusercontent.com https://avatars.githubusercontent.com; connect-src 'self' https://api.github.com https://unpkg.com https://identity.netlify.com; frame-ancestors 'none'"

# Les fonctions repondent en /api/* (declare dans chaque fonction via `config.path`).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
